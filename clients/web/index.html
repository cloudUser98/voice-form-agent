<!doctype html>
<meta charset="utf-8">
<title>voice-form-agent</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  button { font: inherit; padding: .5rem 1rem; }
  #log p { margin: .4rem 0; } .user { color: #444; } .agent { color: #0a5; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-size: .8rem; text-transform: uppercase; color: #888; font-weight: 600; }
  .val { cursor: pointer; font-weight: 600; } .val:hover { background: #ffe; }
  .quote { color: #666; font-style: italic; }
  .tag { font-size: .72rem; padding: .1rem .4rem; border-radius: 3px; white-space: nowrap; }
  .heard { background: #dff5e3; color: #096; }
  .inferred, .prefill { background: #ffe9c7; color: #a60; }
  .corrected { background: #e2e8ff; color: #33a; }
  .missing td { color: #bbb; }
</style>

<h1>voice-form-agent</h1>
<p>
  <select id="form"><option>visit</option><option>hotel</option></select>
  <button id="go">Start talking</button>
  <span id="status"></span>
</p>
<div id="log"></div>

<table>
  <thead><tr><th>Field</th><th>Value</th><th>Based on</th><th></th></tr></thead>
  <tbody id="fields"></tbody>
</table>
<p id="hint" style="color:#888;font-size:.85rem">
  Amber means the agent worked the value out rather than hearing it — check those.
  Click any value to correct it; the conversation carries on uninterrupted.
</p>

<script type="module">
// Minimal browser client: microphone in, speech out. All the agent logic lives
// on the server — this file only moves PCM around.
const RATE = 24000;
const $ = (id) => document.getElementById(id);
const log = (cls, text) => {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = (cls === 'user' ? '👤 ' : '🤖 ') + text;
  $('log').append(p);
};

// The correction surface: every field, what it was based on, and how it got
// there. A value the agent invented shows up amber with no quote behind it.
function render({ data = {}, missing = [], evidence = {} }, ws) {
  const names = [...new Set([...Object.keys(data), ...missing])];
  $('fields').replaceChildren(...names.map((name) => {
    const row = document.createElement('tr');
    const has = data[name] !== undefined;
    if (!has) row.className = 'missing';

    const ev = evidence[name] || {};
    const shown = Array.isArray(data[name]) ? data[name].join(', ') : (data[name] ?? '—');

    row.innerHTML = `<td>${name}</td>`;
    const cell = document.createElement('td');
    cell.className = 'val';
    cell.textContent = shown;
    cell.title = 'Click to correct';
    cell.onclick = () => {
      const input = document.createElement('input');
      input.value = has ? shown : '';
      input.style.width = '100%';
      const commit = () => {
        const raw = input.value.trim();
        // Lists are typed comma-separated; the schema decides which is which.
        const value = Array.isArray(data[name]) ? raw.split(',').map((s) => s.trim()).filter(Boolean) : raw;
        ws.send(JSON.stringify({ type: 'correct', field: name, value }));
      };
      input.onkeydown = (k) => { if (k.key === 'Enter') commit(); if (k.key === 'Escape') render({ data, missing, evidence }, ws); };
      input.onblur = commit;
      cell.replaceChildren(input);
      input.focus();
    };
    row.append(cell);

    const q = document.createElement('td');
    q.className = 'quote';
    q.textContent = ev.heard ? `“${ev.heard}”` : (has ? '— nothing quoted —' : '');
    row.append(q);

    const tag = document.createElement('td');
    if (has) tag.innerHTML = `<span class="tag ${ev.source || 'inferred'}">${ev.source || 'inferred'}</span>`;
    row.append(tag);
    return row;
  }));
}

$('go').onclick = async () => {
  $('go').disabled = true;
  $('status').textContent = 'connecting…';

  const ctx = new AudioContext({ sampleRate: RATE });

  // ---- playback: schedule chunks back to back on one moving cursor --------
  let cursor = 0;
  let sources = [];
  const play = (buf) => {
    const pcm = new Int16Array(buf);
    const audio = ctx.createBuffer(1, pcm.length, RATE);
    const ch = audio.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = ctx.createBufferSource();
    src.buffer = audio;
    src.connect(ctx.destination);
    cursor = Math.max(cursor, ctx.currentTime);
    src.start(cursor);
    cursor += audio.duration;
    sources.push(src);
    src.onended = () => { sources = sources.filter((s) => s !== src); };
  };
  const stopPlayback = () => { sources.forEach((s) => { try { s.stop(); } catch {} }); sources = []; cursor = 0; };

  // ---- microphone --------------------------------------------------------
  const worklet = `class P extends AudioWorkletProcessor{
    process(inputs){ const c = inputs[0][0]; if (c) this.port.postMessage(c.slice()); return true; }
  } registerProcessor('tap', P)`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'application/javascript' })));

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  const tap = new AudioWorkletNode(ctx, 'tap');
  ctx.createMediaStreamSource(stream).connect(tap);

  // ---- protocol ----------------------------------------------------------
  // The socket is opened only now, after every await above. Opening it earlier
  // races the microphone permission prompt: the socket connects first, onopen
  // is assigned too late to ever fire, and the session never starts.
  const host = location.hostname || 'localhost';   // also works from file://
  const ws = new WebSocket(`ws://${host}:8787`);
  ws.binaryType = 'arraybuffer';

  tap.port.onmessage = (e) => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.data;
    const pcm = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) pcm[i] = Math.max(-1, Math.min(1, f32[i])) * 32767;
    ws.send(pcm.buffer);
  };

  ws.onopen = () => { $('status').textContent = 'starting…'; ws.send(JSON.stringify({ type: 'start', form: $('form').value })); };
  ws.onerror = () => { $('status').textContent = `⚠️ cannot reach ws://${host}:8787 — is "npm run serve" running?`; };
  ws.onclose = () => { $('status').textContent = 'closed'; stream.getTracks().forEach((t) => t.stop()); };

  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) return play(ev.data);
    const e = JSON.parse(ev.data);
    if (e.type === 'ready') $('status').textContent = 'listening';
    if (e.type === 'transcript') log(e.role, e.text);
    if (e.type === 'state') render(e, ws);
    if (e.type === 'interrupted') stopPlayback();       // visitor started talking
    if (e.type === 'done') { $('status').textContent = `done · ${JSON.stringify(e.result)}`; render(e, ws); }
    if (e.type === 'error') $('status').textContent = '⚠️ ' + e.error;
  };
};
</script>
